# pagenation scrapy-go 配置文件
#
# 本文件仅包含重要或常用的配置项。
# 完整配置项列表请参考文档：

# 配置优先级：代码中 Settings > scrapy-go.toml > 框架默认值
# 环境变量 SCRAPY_GO_CONFIG 可指定配置文件路径，
# 默认自动加载当前目录下的 scrapy-go.toml。

bot_name = "pagenation"

# 负责任地爬取：通过 User-Agent 标识自己（和你的网站）
# user_agent = "pagenation (+http://www.yourdomain.com)"

# 是否遵守 robots.txt 规则
robotstxt_obey = false

log_level = "debug"

# 并发与限速配置
concurrent_requests = 1
# concurrent_requests_per_domain = 1
download_delay = 0

jobdir = "jobs"

# 禁用 Cookies（默认启用）
# cookies_enabled = false

# 覆盖默认请求头：
# [default_request_headers]
# Accept = "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"
# Accept-Language = "en"

# 启用或禁用 Spider 中间件
#（urllength_limit <= 0 时自动禁用 UrlLength）
# [spider_middlewares]
# HttpError = 50
# Offsite   = 500
# UrlLength = 800
# Depth     = 900
# MyCustomSpiderMiddleware = 543

# 启用或禁用下载器中间件
# （default_request_headers 为空时自动禁用 DefaultHeaders）
[downloader_middlewares]
UserAgent = -1
# DefaultHeaders = 400
# DownloadTimeout = 300
# MyCustomDownloaderMiddleware = 543

# 启用或禁用扩展
# 参考：
# [extensions]
# MyCustomExtension = 100

# 配置 Item Pipeline
# 参考：
# [item_pipelines]
# MyCustomPipeline = 300

# 启用和配置 AutoThrottle 自适应限速扩展（默认禁用）
# 参考：
# autothrottle_enabled = true
# 初始下载延迟（秒）
# autothrottle_start_delay = 5.0
# 高延迟情况下的最大下载延迟（秒）
# autothrottle_max_delay = 60.0
# 每个远程服务器的平均并发请求数
# autothrottle_target_concurrency = 1.0
# 是否为每个收到的响应显示限速统计
# autothrottle_debug = false

# 启用和配置 HTTP 缓存（默认禁用）
# 参考：
# httpcache_enabled = true
# httpcache_expiration_secs = 0
# httpcache_dir = "httpcache"
# httpcache_ignore_http_codes = []
# httpcache_policy = "dummy"

# 数据导出（Feed Export）配置
# 支持多目标同时导出，使用 [feeds."<URI>"] 嵌套字典配置
# 支持格式：json、jsonlines（别名 jl/jsonl）、csv、xml
#
# 每个导出目标支持的字段：
#   format       - 导出格式（必填）
#   overwrite    - 是否覆盖已有文件（默认 false）
#   store_empty  - 无 Item 时是否创建文件（默认 true）
#   encoding     - 编码（默认 "utf-8"）
#   indent       - 缩进空格数，仅 json/xml 有效（默认 0，紧凑输出）
#   fields       - 导出字段白名单，为空则导出全部字段
#   item_element - 仅 xml 有效，每个 Item 的元素名（默认 "item"）
#   root_element - 仅 xml 有效，根元素名（默认 "items"）
#
# [feeds."output/%(name)s.xml"]
# format = "xml"
# indent = 2
# overwrite = true
# item_element = "product"
# root_element = "products"
#
# 也可使用内联 table 语法（更紧凑）：
#[feeds]
#"./items.jsonl" = { format = "jsonlines", overwrite = true }
#"./items.csv" = { format = "csv", fields = ["page", "random_content"] }
#
# 全局导出选项（作为各 feed 未指定时的默认值）
# feed_export_encoding = "utf-8"
# feed_export_indent = 0
# feed_store_empty = true
# feed_export_batch_item_count = 0